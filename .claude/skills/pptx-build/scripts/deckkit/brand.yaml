# deckkit 브랜드 토큰 — 이 파일만 고치면 전 덱에 반영된다.
#
# 컨셉은 기존 브랜드 그대로다: **무채색 + 포인트 하나(Muted Ember 오렌지).**
# 구조(패널 바·카드 바·번호 배지·표 머리)는 근흑이 지고, 오렌지는 핵심 수치에만 소량 쓴다.
#
# 2026-08-03 정정: 무하네스 실험 산출물에서 **구조와 밀도만** 가져와야 했는데 그쪽이 발명한
# 파랑 팔레트까지 통째로 들고 왔었다. 색은 사용자 브랜드가 단일 출처다.

colors:
  ink: "1F2329" # 본문 잉크
  dark: "15171B" # 근흑 — 표지·간지 배경 · 표 머리 · 구조 요소
  dark_lt: "2A2D33" # 근흑 면 위에 얹는 칩·카드
  struct: "15171B" # 구조 강조(= dark). 파랑 자리를 근흑이 대신한다
  struct_lt: "F2F3F5" # 구조 연한 면
  accent: "D66E3A" # Muted Ember 오렌지 — 핵심 수치·강조 바. **소량만**
  accent_lt: "FBF1EA" # 오렌지 연한 면
  muted: "8A9099" # 보조 텍스트·캡션
  line: "DCDEE1" # 선·테두리
  panel: "F2F3F5" # 패널 배경
  white: "FFFFFF"

# 글꼴 크기 9단 — 중간 크기 몰림을 막으려고 단을 벌려 두었다
sizes:
  cover: 40.0
  div: 30.0
  title: 24.0
  kpi: 22.0
  lead: 13.5
  h: 11.5
  body: 10.5
  small: 9.0
  tiny: 7.5

font: "Pretendard"

# 판형·여백 (16:9)
frame:
  slide_w: 13.333
  slide_h: 7.5
  margin: 0.62 # 좌우
  top: 1.34 # 콘텐츠 상단 (헤더 룰 아래)
  bottom: 6.90 # 콘텐츠 하단 (푸터 룰 위)

# 기계 게이트 임계 — 2026-08-03 실측으로 정했다(사용자가 좋다고 한 10장에서 오탐 0)
limits:
  # 우변을 넘으면 결함. 좋다고 한 10장은 전부 0, 거슬린다고 한 2장만 0.14~0.54" 초과.
  right_tolerance: 0.02
  # 이미지가 이보다 좁으면 사람이 못 읽는다. 못 보겠다 한 장 1.25~1.95" / 좋다 한 장 2.45" 이상.
  image_min_w: 2.40
  # 이보다 좁은 그림은 아이콘이라 판독 하한을 적용하지 않는다(실측: 아이콘 0.17~0.52").
  icon_max_w: 1.00
  # 표 행 높이 — 넘으면 셀 안이 비어 보인다. **강제가 아니라 경고다.**
  # 강제로 눌렀더니 긴 셀 텍스트가 잘릴 수 있었다. 재료를 부품에 맞춰 휘게 하는 건
  # 이 저장소가 계속 겪은 실패라(2026-08-03), 미적 판단은 눈이 지고 기계는 알리기만 한다.
  table_row_warn: 0.62
  # 재료 커버리지 — README의 수치 토큰 중 덱이 옮긴 비율. **보고값이지 판정이 아니다.**
  #
  # 앞서 "본문 장당 글자 520자 하한"을 걸었다가 실패했다(2026-08-03). 채우는 가장 싼 방법이
  # 텍스트라 시각 인코딩이 목록으로 바뀌었다 — 본문 12장 합계로 글자 +2,091 · 시각 요소 −39.
  # "이 장 밋밋해 → 카드 4장으로 채워라 → 36장이 동일한 4카드"와 같은 메커니즘이다.
  #
  # 커버리지는 다르다. 같은 절을 늘려 써도 안 오르고 **새 사실을 가져와야** 오른다.
  # 실측: 무하네스 59.5% · v1 66.5% · v2 82.2%. 아래 값 미만이면 알리기만 한다.
  material_cover_warn: 0.70
  # 그림이 배정된 칸을 이만큼은 채워야 한다. 미만이면 칸이 그림 비율과 안 맞는 것 —
  # 그림을 늘리지 말고 `image_h()`로 칸을 그림에 맞춘다(2026-08-03 "칸이 안 맞아 보기 싫다").
  image_fill_min: 0.95
