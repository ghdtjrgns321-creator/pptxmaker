[project]
name = "pptmaker"
version = "0.1.0"
description = "내 프로젝트를 소개하는 B2B 셀링 PPT를 자동 생성하는 도구"
readme = "CLAUDE.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pypdfium2>=5.11.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
