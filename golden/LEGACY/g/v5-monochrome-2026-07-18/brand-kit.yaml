# 브랜드 일관성 단일 출처(Single Source of Truth)
# 이 파일 하나만 바꾸면 모든 PPT의 색·폰트·여백이 일괄 변경된다.
# 값은 B2B 셀링에 무난한 기본값 — 실제 브랜드에 맞게 여기만 수정할 것.

brand:
  name: "My Company"          # 표지/CTA에 노출되는 회사·팀 이름

# 컨셉: 흑백 + 포인트 하나(Muted Ember). 무채색 위에 오렌지 포인트만 소량 등장.
colors:
  primary: "15171B"           # 근흑 — 표지 배경·제목·표 헤더 (무채색)
  accent:  "D66E3A"           # Muted Ember 오렌지 — 강조 바·핵심 수치·차트 (포인트, 소량만)
  text:    "1F2329"           # 본문 잉크 (무채색)
  muted:   "8A9099"           # 보조 텍스트·캡션 (무채색)
  bg:      "FFFFFF"           # 슬라이드 배경
  bg_alt:  "F2F3F5"           # 표 줄무늬·섹션·대체 블록 배경 (무채색)

fonts:
  head: "Pretendard"          # 제목용 폰트 (미설치 시 PPT가 대체 폰트로 렌더)
  body: "Pretendard"          # 본문용 폰트
  mono: "D2Coding"            # 코드·기술 표기용

sizes:                        # 단위 pt — v4.5 타이포 4단 위계(McKinsey 실측: 대비 ≈3:1)
  display: 40                 # 대형 무대 활자 — 표지 제목·스탯 콜아웃 핵심 수치 (golden v5)
  title:   32                 # 표지 대형 제목
  section: 28                 # 본문 헤드라인(완결 주장문, 2줄 허용) — 위계 1
  sub:     14                 # 리드 문단(헤드라인 보조 주장) — 위계 2
  head:    15                 # 컬럼 헤더·목차 번호
  body:    12                 # 본문(볼드 리드-인 문법) — 위계 3
  caption: 9                  # 캡션·푸터·출처 — 위계 4
  foot:    8                  # 각주

layout:
  margin: 0.6                 # 슬라이드 가장자리 여백 (inch)
  logo:   ""                  # 로고 이미지 경로(assets/ 기준). 빈 값이면 텍스트 로고 사용
